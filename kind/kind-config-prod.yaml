kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: prod
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30180
        hostPort: 30180
        listenAddress: "127.0.0.1"
      - containerPort: 30443
        hostPort: 30443
        listenAddress: "127.0.0.1"
  - role: worker
---
