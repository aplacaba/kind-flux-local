kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dev
nodes:
  - role: control-plane
    extraPortMappings:
      # Traefik web (NodePort 30080)
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
      # Traefik websecure (NodePort 30443)
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
  - role: worker
---
