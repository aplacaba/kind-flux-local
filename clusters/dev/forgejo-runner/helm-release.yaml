apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
    namespace: forgejo-runner
  interval: 10m
  timeout: 5m
  values:
    # ── Forgejo instance the runner connects to ──
    forgejo:
      server: http://forgejo.forgejo:3000

    # ── Runner token (placeholder) ──────────────
    # Replace with a real token after Forgejo is up:
    #   kubectl create secret generic runner-secret \
    #     --namespace forgejo-runner \
    #     --from-literal=token=<your-token>
    runnerSecret: runner-secret

    # ── Single persistent runner ────────────────
    replicas: 1

    # ── Resource limits for local dev ────────────
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
