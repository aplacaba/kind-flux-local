apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
    namespace: forgejo-runner
  interval: 10m
  timeout: 5m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
            patch: |-
              - op: add
                path: /spec/template/spec/restartPolicy
                value: Always
  values:
    # ── Forgejo instance the runner connects to ──
    forgejo:
      server: http://forgejo-http.forgejo.svc.cluster.local:3000

    # ── Runner token ───────────────────────────
    runnerSecret:
      create: true
      token: "V-md4gdpXmhe1aNk1UcPPjlYLN4gwahUcyOSpazq8jy"

    # ── Single persistent runner ────────────────
    replicas: 1

    # ── Resource limits for local dev ────────────
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
