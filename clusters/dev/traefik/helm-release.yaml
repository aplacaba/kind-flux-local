apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: traefik
  interval: 10m
  timeout: 5m
  values:
    # ── Service ──────────────────────────────
    service:
      type: NodePort

    # ── Ports ────────────────────────────────
    # web on NodePort 30080 (maps to host:80 via kind config)
    # websecure on NodePort 30443 (maps to host:443 via kind config)
    ports:
      web:
        port: 80
        nodePort: 30080
        expose: true
        exposedPort: 80
      websecure:
        port: 443
        nodePort: 30443
        expose: true
        exposedPort: 443
        tls:
          enabled: true
      metrics:
        expose: false

    # ── Dashboard (disabled for now) ─────────
    dashboard:
      enabled: false

    # ── Providers ────────────────────────────
    providers:
      kubernetesIngress:
        enabled: true
      kubernetesCRD:
        enabled: true

    # ── Resource limits for local dev ────────
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
