apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: forgejo
  interval: 10m
  timeout: 5m
  values:
    # ── Admin user ───────────────────────────
    gitea:
      admin:
        username: forgejo_admin
        password: admin123
        email: admin@forgejo.local

    # ── Server config ────────────────────────
      config:
        server:
          ROOT_URL: http://127.0.0.1:30090
          DOMAIN: 127.0.0.1
          HTTP_PORT: 3000
          SSH_PORT: 22
          SSH_DOMAIN: 127.0.0.1
          PROTOCOL: http

    # ── Service (NodePort for kind) ──────────
    service:
      http:
        type: NodePort
        nodePort: 30090
        port: 3000
      ssh:
        type: NodePort
        nodePort: 30022
        port: 22

    # ── Persistence ──────────────────────────
    # PV + PVC for shared storage are created manually in
    # persistent-volume.yaml. The chart creates the data PVC
    # which binds to forgejo-data-pv.
    persistence:
      enabled: true
      create: true
      storageClass: ""

    # ── Disable ingress ──────────────────────
    ingress:
      enabled: false
      tls: []

    # ── Resource limits for local dev ────────
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
