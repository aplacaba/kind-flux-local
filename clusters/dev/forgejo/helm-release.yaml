apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
    namespace: forgejo
  interval: 10m
  timeout: 5m
  values:
    # ── Admin user ───────────────────────────
    gitea:
      admin:
        username: forgejo_admin
        password: admin123
        email: admin@forgejo.local
        passwordMode: keepUpdated

    # ── Server config ────────────────────────
      config:
        APP_NAME: 'Forgejo CI/CD'
        server:
          ROOT_URL: http://127.0.0.1:30090
          DOMAIN: 127.0.0.1
          HTTP_PORT: 3000
          SSH_PORT: 22
          SSH_DOMAIN: 127.0.0.1
          PROTOCOL: http

    # ── Service (NodePort for kind) ──────────
    service:
      http:
        type: NodePort
        nodePort: 30090
        port: 3000
      ssh:
        type: NodePort
        nodePort: 30022
        port: 22

    # ── Persistence ──────────────────────────
    # PV + PVC for shared storage are created manually in
    # persistent-volume.yaml. The chart creates the data PVC
    # which binds to forgejo-data-pv.
    persistence:
      enabled: true
      create: true
      storageClass: ""
      claimName: gitea-shared-storage
      size: 1Gi

    # ── Pod security context ──────────────────
    # Rootless image needs fsGroup so hostPath volumes are writable
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000

    # ── Resource limits for local dev ────────
    resources:
      limits:
        memory: 2Gi
        cpu: 2000m
      requests:
        cpu: 250m
        memory: 256Mi
