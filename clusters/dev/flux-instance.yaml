apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
    components:
      - source-controller
      - kustomize-controller
      - helm-controller
      - notification-controller
  cluster:
    type: kubernetes
    size: small
    networkPolicy: true
    multitenant: false
  sync:
    kind: GitRepository
    url: "https://github.com/aplacaba/kind-flux-local.git"
    ref: "refs/heads/main"
    path: "clusters/dev"
    interval: "1m"
